<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — Ashutosh Sharma.">
    <meta name="robots" content="noindex">

    <title>404 – Page Not Found | Ashutosh Sharma</title>

    <link rel="canonical" href="https://ashutoshqs.github.io/404.html">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#f9fafb">

</head>

<body class="error-page">

<div class="container">

    <main>

        <section class="error-content fade-in">

            <h1>404</h1>

            <p>
                The page you are looking for does not exist.
            </p>

            <p>
                Perhaps it lies outside the present structure of this site.
            </p>

            <div class="error-link">
                <a href="/index.html" aria-label="Return to homepage">Return to homepage →</a>
            </div>

        </section>

    </main>

    <footer class="error-footer">
        <p>
            © <span id="year"></span> Ashutosh · Mathematics
        </p>
    </footer>

    <div class="error-mark">
        <!-- Replace this image with your refined favicon mark later -->
        <a href="/index.html" aria-label="Return to homepage">
            <img src="/android-chrome-512x512.png" alt="Site mark">
        </a>
    </div>

</div>

<script>
    document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
